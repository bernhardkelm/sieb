name: CI

on:
  push:
    branches: [main]
    # release tags carry no `v` prefix, the trailing `*` admits a prerelease suffix
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build-only

      - name: Fixtures are up to date
        run: |
          npm run fixtures:generate
          git status --porcelain -- src/server/sources/mock/fixtures
          test -z "$(git status --porcelain -- src/server/sources/mock/fixtures)"

  image:
    needs: check
    runs-on: ubuntu-latest

    # a job-level map replaces the workflow-level one, so contents is restated
    permissions:
      contents: read
      packages: write

    # pull requests and manual runs only build, there is no preview deployment to publish for
    env:
      PUBLISH: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v7

      # the runtime stage runs its RUN steps on the target platform, arm64 needs emulation
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # image references must be lower case, the repository owner may not be
      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # a prerelease gets only its full version and never moves latest or x.y,
      # no bare major while 0.x since it would span breaking changes
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/0.') }}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
