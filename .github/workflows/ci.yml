name: CI

on:
  push:
    branches: [main]
    # release tags carry no `v` prefix, the trailing `*` admits a prerelease suffix
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build-only

      - name: Fixtures are up to date
        run: |
          npm run fixtures:generate
          git status --porcelain -- src/server/sources/mock/fixtures
          test -z "$(git status --porcelain -- src/server/sources/mock/fixtures)"

  image:
    needs: check
    runs-on: ubuntu-latest

    # a job-level map replaces the workflow-level one, so contents is restated
    permissions:
      contents: read
      packages: write

    # pull requests and manual runs only build, there is no preview deployment to publish for
    env:
      PUBLISH: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v7

      # the runtime stage runs its RUN steps on the target platform, arm64 needs emulation
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # image references must be lower case, the repository owner may not be
      - name: Resolve the image names
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "CHECKER_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sieb-checker" >> "$GITHUB_ENV"

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # a prerelease gets only its full version and never moves latest or x.y,
      # no bare major while 0.x since it would span breaking changes
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/0.') }}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the Auto-check worker, built for the runner first so its startup checks run before a push
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.checker
          platforms: linux/amd64
          load: true
          tags: sieb-checker:ci
          cache-from: type=gha,scope=checker

      # the module graphs load, both config checks refuse to start, the inspect server answers
      - name: Smoke test the checker image
        run: |
          set -euo pipefail
          run=(docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges)
          refusal="$("${run[@]}" sieb-checker:ci 2>&1 || true)"
          echo "$refusal"
          grep -qx '\[sieb-checker\] SIEB_WORKER_URL is required' <<<"$refusal"
          # the fetcher runs under a uid of its own that shares only the group with the checker
          fetcher="$("${run[@]}" --user 1001:1000 sieb-checker:ci src/checker/fetcher/fetcherMain.ts 2>&1 || true)"
          echo "$fetcher"
          grep -qx '\[sieb-fetcher\] SIEB_WORKER_URL is required' <<<"$fetcher"
          "${run[@]}" --entrypoint git sieb-checker:ci --version
          "${run[@]}" --entrypoint claude sieb-checker:ci --version
          # SIEB_CHECKER_MODEL and SIEB_CHECKER_EFFORT need these flags in the pinned Claude Code
          help="$("${run[@]}" --entrypoint claude sieb-checker:ci --help)"
          grep -q -- '--model <model>' <<<"$help"
          grep -q -- '--effort <level>' <<<"$help"
          tools="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "${run[@]}" -i --entrypoint node sieb-checker:ci src/checker/inspect/inspectMain.ts /app)"
          for tool in strings readelf objdump unzip_list jq; do
            grep -q "\"name\":\"$tool\"" <<<"$tools"
          done

      # same tag rules and platforms as the main image, its own cache scope
      - id: checker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.CHECKER_IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/0.') }}
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.checker
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.checker-meta.outputs.tags }}
          labels: ${{ steps.checker-meta.outputs.labels }}
          annotations: ${{ steps.checker-meta.outputs.annotations }}
          cache-from: type=gha,scope=checker
          cache-to: type=gha,scope=checker,mode=max
